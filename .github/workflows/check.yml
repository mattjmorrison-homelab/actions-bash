name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./

      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: shellcheck install.sh

      - name: bats
        run: bats test/
